spring.application.name=autoloc-api

# Connexion a la base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Mot de passe via variable d'environnement DB_PASSWORD (vide par defaut)
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
# Etape "Atelier 2" : create (supprime et recrees les tables). A REMETTRE A update ENSUITE.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
